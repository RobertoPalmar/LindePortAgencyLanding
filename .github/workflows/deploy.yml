name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  pull_request:
  # Permite relanzar un despliegue desde la pestaña Actions sin tener que
  # inventarse un commit: el ajuste de production branch de Pages solo se
  # aplica al siguiente deploy, nunca al que ya está publicado.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # El adaptador corre `next build` por dentro y deja el resultado en
      # .vercel/output/static, que es lo que lee wrangler.toml.
      - run: npx @cloudflare/next-on-pages

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy

      - run: echo "${{ steps.deploy.outputs.deployment-url }}" >> $GITHUB_STEP_SUMMARY
